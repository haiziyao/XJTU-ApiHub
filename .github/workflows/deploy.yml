name: Deploy Aliyun

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build static musl binary
        run: |
          docker run --rm \
            -v "$PWD":/app \
            -w /app \
            rust:1.88-alpine sh -c "
              apk add --no-cache build-base perl &&
              cargo build --release --manifest-path xjtu-api/Cargo.toml
            "
          file xjtu-api/target/release/xjtu-api
          gzip -9 -c xjtu-api/target/release/xjtu-api > /tmp/xjtu-api.gz
          ls -lh /tmp/xjtu-api.gz

      - name: Install deploy key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.ALIYUN_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.ALIYUN_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload binary
        run: |
          scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            /tmp/xjtu-api.gz \
            "${{ secrets.ALIYUN_USER }}@${{ secrets.ALIYUN_HOST }}:/usr/local/bin/xjtu-api.gz"

      - name: Restart service and check health
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "${{ secrets.ALIYUN_USER }}@${{ secrets.ALIYUN_HOST }}" '
              set -e
              gunzip -c /usr/local/bin/xjtu-api.gz > /usr/local/bin/xjtu-api.new
              chmod 755 /usr/local/bin/xjtu-api.new
              mv /usr/local/bin/xjtu-api.new /usr/local/bin/xjtu-api
              rm -f /usr/local/bin/xjtu-api.gz
              systemctl restart xjtu-api
              sleep 1
              curl -fsS http://127.0.0.1:8080/health
            '
